<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: white; border-radius: 12px;
                 padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { color: #2c3e50; font-size: 22px; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
    .word { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #eee; }
    .word:last-child { border-bottom: none; }
    .word-title { font-size: 18px; font-weight: bold; color: #2c3e50; }
    .pos { font-size: 13px; font-weight: normal; color: #888; font-style: italic; margin-left: 6px; }
    .word-meaning { color: #333; margin-top: 6px; font-size: 15px; }
    .example { color: #555; margin-top: 6px; font-size: 14px; }
    .synonyms { color: #666; margin-top: 6px; font-size: 13px; }
    .footer { margin-top: 24px; font-size: 12px; color: #999; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>&#128218; Your Daily Vocabulary</h1>

    <div class="word" th:each="w, stat : ${words}">
      <div class="word-title">
        <span th:text="${stat.index + 1} + '. ' + ${w.word}"></span>
        <span class="pos" th:if="${w.part_of_speech != null}" th:text="${w.part_of_speech}"></span>
      </div>
      <div class="word-meaning" th:text="${w.meaning}"></div>
      <div class="example" th:if="${w.example_sentence != null and !#strings.isEmpty(w.example_sentence)}">
        &#128172; <em th:text="${w.example_sentence}"></em>
      </div>
      <div class="synonyms" th:if="${w.synonyms != null and !#lists.isEmpty(w.synonyms)}">
        &#128257; <strong>Synonyms:</strong>
        <span th:text="${#strings.listJoin(w.synonyms, ', ')}"></span>
      </div>
    </div>

    <div class="footer">Sent by DailyVocab</div>
  </div>
</body>
</html>
