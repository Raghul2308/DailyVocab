spring.application.name=DailyVocab

# Resend API
resend.api.key=${RESEND_API_KEY}

# Sender address (must be a verified domain in Resend; use onboarding@resend.dev for testing)
mail.from=DailyVocab <onboarding@resend.dev>

# Recipient emails (comma-separated for multiple)
mail.recipient=${MAIL_RECIPIENT}

# App base URL (used in quiz links)
app.base-url=http://localhost:8081

# Gemini API
gemini.api.key=${GEMINI_API_KEY}

# Scheduler: daily vocab email at 1:00 PM IST (7:30 AM UTC)
vocab.schedule.cron=0 30 7 * * *
